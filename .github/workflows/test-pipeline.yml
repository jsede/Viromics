name: Viromics Pipeline & Dashboard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python Unit & Schema Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schema validator
        run: python -m pip install --upgrade pip && pip install jsonschema==4.23.0

      - name: Run Viromics Python verification suites
        run: |
          python pipeline/bin/test_prepare_consensus_vcf.py
          python pipeline/bin/test_translation_phase.py
          python pipeline/bin/regression_test_distance.py
          python pipeline/bin/test_samtools_aa.py
          python pipeline/bin/test_variant_qual_filter.py
          python pipeline/bin/test_parse_metrics_m2.py

  dashboard-ci:
    name: Dashboard Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint React codebase
        working-directory: dashboard
        run: npm run lint

      - name: Run Vitest suite
        working-directory: dashboard
        run: npm run test

      - name: Build production bundle
        working-directory: dashboard
        run: npm run build

  nextflow-e2e:
    name: Nextflow Synthetic E2E (Illumina + ONT)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          chmod +x nextflow
          sudo mv nextflow /usr/local/bin/
          nextflow -v

      - name: Setup Conda environment from pipeline/environment.yml
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          environment-file: pipeline/environment.yml
          activate-environment: viromics
          use-mamba: true

      - name: CLI help & negative parameter/samplesheet validation checks
        run: |
          nextflow run pipeline/main.nf -ansi-log false --help
          if nextflow run pipeline/main.nf -ansi-log false --min_cov 50; then
            echo "ERROR: Expected unknown parameter --min_cov to fail fast"
            exit 1
          fi
          if nextflow run pipeline/main.nf -ansi-log false --platform illumina --sample_sheet pipeline/test_data/samplesheet_ont.csv --reference pipeline/test_data/ref_synth.fasta; then
            echo "ERROR: Expected conflicting samplesheet platform to fail fast"
            exit 1
          fi

      - name: Verify live bcftools filter unit test in conda env
        run: python pipeline/bin/test_variant_qual_filter.py

      - name: Run synthetic Illumina E2E + verify_e2e + -resume cache check
        run: |
          nextflow run pipeline/main.nf \
            -ansi-log false \
            --platform illumina \
            --sample_sheet pipeline/test_data/samplesheet_illumina.csv \
            --reference pipeline/test_data/ref_synth.fasta \
            --gff pipeline/test_data/ref_synth.gff3 \
            --primer_bed pipeline/test_data/primers_synth.bed \
            --metadata pipeline/test_data/metadata_synth.csv \
            --run_id ci_synth_illumina \
            --max_cpus 2 \
            --max_memory 6.GB \
            --outdir ci_results_illumina

          python pipeline/test_data/verify_e2e.py \
            --outdir ci_results_illumina \
            --platform illumina \
            --primer-bed pipeline/test_data/primers_synth.bed \
            --require-jsonschema

          rm -f ci_resume_trace.txt
          nextflow run pipeline/main.nf \
            -ansi-log false \
            --platform illumina \
            --sample_sheet pipeline/test_data/samplesheet_illumina.csv \
            --reference pipeline/test_data/ref_synth.fasta \
            --gff pipeline/test_data/ref_synth.gff3 \
            --primer_bed pipeline/test_data/primers_synth.bed \
            --metadata pipeline/test_data/metadata_synth.csv \
            --run_id ci_synth_illumina \
            --max_cpus 2 \
            --max_memory 6.GB \
            --outdir ci_results_illumina \
            -resume \
            -with-trace ci_resume_trace.txt

          python - <<'PY'
          import csv
          import sys

          expected_procs = {
              "FASTQ_QC",
              "INDEX_REFERENCE",
              "ALIGN_READS",
              "PRIMER_TRIM",
              "VARIANT_CALL",
              "CONSENSUS_GEN",
              "AGGREGATE_METRICS",
          }

          with open("ci_resume_trace.txt", newline="", encoding="utf-8") as fh:
              rows = list(csv.DictReader(fh, delimiter="\t"))

          if not rows:
              print("FAIL: ci_resume_trace.txt contains no task rows.", file=sys.stderr)
              sys.exit(1)

          non_cached = [
              (r.get("name", "?"), r.get("status", "?"))
              for r in rows
              if r.get("status") != "CACHED"
          ]
          if non_cached:
              print(f"FAIL: Non-cached tasks detected on -resume: {non_cached}", file=sys.stderr)
              sys.exit(1)

          seen_procs = {
              r.get("name", "").split(" (", 1)[0].split(":")[-1].strip()
              for r in rows
          }
          missing_procs = sorted(expected_procs - seen_procs)
          if missing_procs:
              print(
                  f"FAIL: Missing expected processes in -resume trace: {missing_procs} (seen: {sorted(seen_procs)})",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"PASS: All {len(rows)} tasks across all {len(expected_procs)} processes had status == 'CACHED'.")
          PY

      - name: Run synthetic ONT E2E + verify_e2e
        run: |
          nextflow run pipeline/main.nf \
            -ansi-log false \
            --platform ont \
            --sample_sheet pipeline/test_data/samplesheet_ont.csv \
            --reference pipeline/test_data/ref_synth.fasta \
            --gff pipeline/test_data/ref_synth.gff3 \
            --primer_bed pipeline/test_data/primers_synth.bed \
            --metadata pipeline/test_data/metadata_synth.csv \
            --run_id ci_synth_ont \
            --max_cpus 2 \
            --max_memory 6.GB \
            --outdir ci_results_ont

          python pipeline/test_data/verify_e2e.py \
            --outdir ci_results_ont \
            --platform ont \
            --primer-bed pipeline/test_data/primers_synth.bed \
            --require-jsonschema
